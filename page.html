<!DOCTYPE html>
<html>
<head>
    <title>HTML Frames Example</title>
</head>
<frameset rows="30%,70%"> <!-- Split page horizontally -->
    <!-- Top header frame -->
    <frame src="header.html" name="header">

    <!-- Bottom section split vertically -->
    <frameset cols="30%,70%"> <!-- Split bottom into left menu and right content -->
        <!-- Left menu -->
        <frame src="menu.html" name="menu">
        <!-- Right content -->
        <frame src="welcome.html" name="content">
    </frameset>
</frameset>
</html>
