<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List Illusion</title>
    <style>
        ul, ol {
            list-style: none; /* remove bullets/numbers */
            padding: 0;
            margin: 0;
        }
        li {
            display: inline;   /* make list items inline like text */
            margin-right: 5px; /* spacing between "words" */
        }
        li ul, li ol {
            display: inline;   /* nested lists inline as well */
        }
    </style>
</head>
<body>
    <p>
        Here is a "paragraph" that is actually a nested list:
    </p>

    <ol>
        <li>This</li>
        <li>is
            <ul>
                <li>a</li>
                <li>nested</li>
            </ul>
        </li>
        <li>list</li>
        <li>that
            <ol>
                <li>looks</li>
                <li>like</li>
                <li>text.</li>
            </ol>
        </li>
    </ol>
</body>
</html>
