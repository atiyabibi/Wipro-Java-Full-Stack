<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitors Information</title>
</head>
<body>
    <h1>Visitors Information</h1>
    <hr>
    <form>
        <table border="1" cellpadding="5" cellspacing="0">
            <tr>
                <td>Email Address:</td>
                <td>
                    <input type="email" name="email" required> 
                </td>
            </tr>
            <tr>
                <td>User’s Interest</td>
                <td>
                <input type="checkbox" name="interest" value="research">Research
                <input type="checkbox" name="interest" value="purchase">Purchase
                </td>
            </tr>
            <tr>
                <td>Occupation</td>
                <td>
                <select name="occupation">
                        <option selected>Select one</option>
                        <option>Student</option>
                        <option>Teacher</option>
                        <option>Engineer</option>
                        <option>Doctor</option>
                        <option>Other</option>
                    </select>
                    </td>
            </tr>
            <tr>
                <td>Want us to send junk emails?</td>
                <td>
                    <input type="radio" name="junkmail" value="absolutely">Absolutely
                    <input type="radio" name="junkmail" value="no way">No way
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
